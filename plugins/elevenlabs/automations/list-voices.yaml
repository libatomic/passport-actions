version: 1.0.0
name: List ElevenLabs voices
description: >-
  Lists the voices on your ElevenLabs account with their ids, and shows how
  many characters of this month's quota are left.
help: |
  Run it to find the id of a voice to list under a narration channel's
  **Other voices**. The channel's **Default voice** menu already shows your
  voices by name.

  A professional voice clone shows no models until ElevenLabs has finished
  training it; it cannot be used for narration before then.
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/account-voice.svg
on:
  - manual: true
outputs:
  type: object
  required: [voices]
  properties:
    voices:
      type: array
      title: Voices
      items:
        type: object
        required: [voice_id, name]
        properties:
          voice_id: { type: string, title: Voice id }
          name:     { type: string, title: Name }
          category: { type: string, title: Kind }
          models:
            type: array
            title: Ready on models
            items: { type: string }
    tier:
      type: string
      title: Plan
    characters_used:
      type: integer
      title: Characters used this month
    characters_limit:
      type: integer
      title: Characters allowed this month
    characters_reset_at:
      type: string
      format: date-time
      title: Quota resets at
returns:
  voices: "${{ steps.voices.outputs.voices }}"
  tier: "${{ steps.usage.outputs.tier }}"
  characters_used: "${{ steps.usage.outputs.characters_used }}"
  characters_limit: "${{ steps.usage.outputs.characters_limit }}"
  characters_reset_at: "${{ steps.usage.outputs.characters_reset_at }}"
steps:
  - id: voices
    action: elevenlabs/voices.list
  - id: usage
    action: elevenlabs/usage.get
