version: 1.1.0
name: Create audio narration
description: >-
  Reads an article aloud with an ElevenLabs voice, once for each audience
  chosen, and files the MP3s as one narration that gives each member the
  version for their audience. Running it again for the same article replaces
  them.
help: |
  **Run it from an article.** On an article's page, choose **Create Audio
  Narration** from the Extensions menu, pick who to make audio for and the
  voice, adjust what is read, and run it. The result is one narration in
  the site's assets.

  **One narration, a version per audience.** The article is read once for
  each audience under "Make audio for", as a member of that audience hears
  it: restricted sections the audience can see are read, and the others are
  replaced by a short spoken note. Each version is an MP3 only that
  audience's members can fetch. The narration itself is a single asset:
  whoever plays it gets the version for their audience.

  **Who hears which.** A member of several of the audiences gets the version
  of the best-ranked one (the order under Audiences). A version read for an
  audience includes what the audiences ranked below it can see. A member in
  none of the audiences gets no audio, so include your widest audience if
  everyone should hear something.

  **Preview as** picks the one audience the editor marks restricted sections
  for, and the one "Spoken text" is shown for. Left empty, it is the first
  audience under "Make audio for".

  **Running it again** for the same article reads every chosen audience
  again and replaces their MP3s. The narration keeps its id and link, so a
  podcast distribution that uses it plays the new audio. The form opens with
  what was read last time. An audience left out of a later run is no longer
  part of the narration; its MP3 stays under Assets, for that audience only.

  **Voices.** There is a default voice. List other voices and the form gets
  a Voice menu.

  **Voice tags.** Editors can type tags into the text: `[pause]`,
  `[short pause]`, `[long pause]` and `[pause 1.5s]` on every model, and on
  eleven_v3 and eleven_v4 also `[whispers]`, `[laughs]`, emotions and a few
  sounds. The editor's Voice tags button lists them for the model.

  **Long articles** are read in several requests and the audio joined into
  one MP3. An MP3 is only replaced once every piece has been read.

  **Cost.** ElevenLabs bills every request: every audience of every run, and
  every paragraph played from the form. "Longest article to read" caps what
  one version can cost; a run that would go over it for any audience reads
  nothing.
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/account-voice.svg

# Added as often as wanted: one per voice, model or language, each its own
# item on the article's Extensions menu under the label the publisher gave it.
# Each one's files carry its short name, so two never replace each other's.
multiple: true

extension:
  on: article
  label: Create Audio Narration
  # Offered when there is something to read.
  if: "${{ trim(article.body ?? '') != '' }}"

# This extension's own settings, filled in when the publisher adds it. The
# ElevenLabs API key is the plugin's (secrets.api_key).
settings:
  type: object
  required: [voice_id]
  properties:
    voice_id:
      type: string
      title: Default voice
      description: The voice that reads a narration unless another is picked when it is run.
      help: |
        A premade ElevenLabs voice or your own clone. The menu lists the
        voices on your ElevenLabs account once the plugin's API key is saved.
        A professional clone cannot be used until ElevenLabs has finished
        training it.
      minLength: 1
      ui:
        options:
          action: elevenlabs/voices.list
          items: "${{ outputs.voices }}"
          value: "${{ item.voice_id }}"
          label: "${{ item.name }}"
    voice_name:
      type: string
      title: Default voice name
      description: What the Voice menu calls the default voice, such as the narrator's name.
      ui: { placeholder: Jon }
    voices:
      type: array
      title: Other voices
      description: >-
        Voices a narration can use instead of the default. Leave empty to
        read every narration in the default voice.
      help: |
        The form shown when a narration is created gets a Voice menu with
        the default voice first and these after it. Pick each voice from
        your account's voices and give it the name the menu should show.
      default: []
      items:
        type: object
        required: [label, voice_id]
        properties:
          label:
            type: string
            title: Name
            minLength: 1
            ui: { placeholder: Jon }
          voice_id:
            type: string
            title: Voice
            minLength: 1
            # A menu per row (guide 2.8); a text box for the id if the
            # voices cannot be loaded.
            ui:
              options:
                action: elevenlabs/voices.list
                items: "${{ outputs.voices }}"
                value: "${{ item.voice_id }}"
                label: "${{ item.name }}"
    model_id:
      type: string
      title: Model
      description: Which ElevenLabs model reads. It decides the quality, the cost and which voice tags work.
      help: |
        Each request carries at most 40,000 characters on Flash v2.5 and
        Turbo v2.5, 10,000 on Multilingual v2 and v4, and 5,000 on v3. A
        longer article is read in several requests and the audio joined into
        one MP3.

        v3 and v4 read voice tags such as `[whispers]`. A voice cloned before
        v4 needs retraining for it in ElevenLabs.
      enum: [eleven_flash_v2_5, eleven_turbo_v2_5, eleven_multilingual_v2, eleven_v3, eleven_v4]
      default: eleven_v4
      ui:
        labels:
          eleven_flash_v2_5: Flash v2.5
          eleven_turbo_v2_5: Turbo v2.5
          eleven_multilingual_v2: Multilingual v2
          eleven_v3: v3
          eleven_v4: v4
    max_characters:
      type: integer
      title: Longest article to read
      description: A run fails, before anything is read, when the text for any one audience is longer than this. It caps what one version of a narration can cost. 0 reads any length.
      minimum: 0
      default: 0
      ui: { suffix: characters }
    template:
      type: string
      format: template
      title: Read around the article
      description: What is read before and after the text chosen in the form, as a template. Without the placeholder, the text is read after it.
      help: |
        `{{ .script }}` marks where the text from the form goes (the
        article's body, as edited there), rendered for each audience.
        The rest can use the usual template data and functions, such as
        `{{ .article.title }}` and `timeFormat`.

        Each `<p>` becomes its own paragraph. An empty template reads the
        text alone. Voice tags such as `[long pause]` work here too.

        This wrapper is not shown in the form's editor. "Spoken text" in the
        form shows everything that will be read, the wrapper included.
      default: '<p>{{ .article.title }} was published on {{ timeFormat .article.published_at "dddd, MMMM D, YYYY" "America/New_York" }}. [long pause]</p>{{ .script }}'
      ui: { language: template }
    fallback_text:
      type: string
      title: Spoken note for restricted sections
      description: Read in place of a restricted section the audience cannot access. Leave empty to skip those sections silently.
      help: |
        Read once, however many sections are hidden. A section can be given
        its own line in the form's editor ("Read instead").
      default: "The rest of this section is for subscribers. Subscribe to hear the full article."
      ui: { widget: textarea, rows: 2 }
    skip_parts:
      type: array
      title: Page parts to skip
      description: CSS selectors for parts of the page that are not read.
      help: |
        The default skips images, media, figures, tables, code, navigation,
        anything with `class="no-audio"` and WordPress chrome (buttons, post
        title, date, categories, author, share and related blocks).

        Scripts, forms and anything marked `data-text="skip"` are always
        skipped.
      uniqueItems: true
      items: { type: string, minLength: 1 }
      default:
        - img
        - picture
        - video
        - audio
        - figure
        - figcaption
        - aside
        - nav
        - pre
        - code
        - table
        - .no-audio
        - '[data-narration="skip"]'
        - .wp-block-buttons
        - .wp-block-post-title
        - .wp-block-post-date
        - .wp-block-post-terms
        - .wp-block-post-author
        - .wp-block-social-links
        - .sharedaddy
        - .jp-relatedposts
    pronunciations:
      type: array
      title: Pronunciations
      description: Words the voice should say differently, such as a name it gets wrong.
      help: |
        Each Term is replaced by its Say as text before the text is read.
        Terms match whole words with the same capitalization (`Dr.` and `C++`
        work too). Editors can also add one from the form's editor by
        right-clicking a word.
      default: []
      items:
        type: object
        required: [term, say_as]
        properties:
          term:
            type: string
            title: Term
            minLength: 1
            ui: { placeholder: Wemby }
          say_as:
            type: string
            title: Say as
            ui: { placeholder: Wem-bee }
    text_cleanup:
      type: boolean
      title: Clean up numbers and symbols
      description: Read money, percentages, scores, heights and common abbreviations the way a broadcaster would.
      help: |
        $5M becomes "5 million dollars", 112-108 becomes "112 to 108", No. 1
        becomes "number 1", vs. becomes "versus". Runs after the
        pronunciations, so a pronunciation for the same text wins.
      default: true
  ui:
    layout:
      - section: Voice
        description: >-
          The default voice, other voices a narration can pick, the model,
          and the longest article to read (to cap what one version of a
          narration can cost).
        rows:
          - [voice_id, voice_name]
          - [voices]
          - [ { field: model_id, span: 8 }, { field: max_characters, span: 4 } ]
      - section: What is read
        description: >-
          Read around the article, in place of restricted sections the
          audience cannot access, and which page parts are skipped.
        rows:
          - [template]
          - [fallback_text]
          - [skip_parts]
      - section: Pronunciation and cleanup
        description: >-
          Names and terms the voice should say differently, and the built-in
          rewrite of numbers, symbols and abbreviations.
        rows:
          - [pronunciations]
          - [text_cleanup]

# The form shown each time a narration is created. It opens with the values
# of the last run on the article (guide 5.7), so edited text is still there.
inputs:
  type: object
  required: [audiences]
  properties:
    audiences:
      type: array
      title: Make audio for
      description: The article is read once for each of these audiences, as its members hear it. Each member then gets the version for their audience.
      help: |
        A member of several of these audiences gets the version of the
        best-ranked one. A member in none of them gets no audio.
      minItems: 1
      # a narration holds at most 64 versions
      maxItems: 64
      uniqueItems: true
      items: { type: string, format: passport.audience }
    # The paragraph editor marks restricted sections for one audience, and
    # its audience hint names one passport.audience field (guide 2.6), so
    # the list above cannot serve. A default cannot follow another field of
    # the form (guide 2.10), so this one is optional and the steps fall
    # back to the first audience chosen.
    preview_audience:
      type: string
      format: passport.audience
      title: Preview as
      description: The audience the editor below marks restricted sections for, and the one "Spoken text" is shown for. Left empty, "Spoken text" uses the first audience under "Make audio for".
    voice:
      type: string
      title: Voice
      description: The voice that reads this narration.
      # The default voice until another is picked.
      default: "${{ automation.settings.voice_id }}"
      ui:
        options:
          # The default voice, then the other voices. The account's voices
          # are read from ElevenLabs only to name the default voice: its
          # name there is what the menu calls it, unless the settings give
          # it another ("Default voice name"). The other voices go by the
          # names the settings give them. With no other voices the list is
          # empty, and the form shows the default alone, named by
          # default_label. The map literal is in parentheses so the
          # expression engine does not read its braces as a closure.
          action: elevenlabs/voices.list
          items: >-
            ${{ len(automation.settings.voices ?? []) == 0 ? []
            : concat([({"voice_id": automation.settings.voice_id,
            "label": trim(automation.settings.voice_name ?? "") != "" ? trim(automation.settings.voice_name)
            : (first(filter(outputs.voices ?? [], .voice_id == automation.settings.voice_id))?.name ?? "Default voice")})],
            automation.settings.voices) }}
          value: "${{ item.voice_id }}"
          label: "${{ item.label }}"
          default_label: >-
            ${{ trim(automation.settings.voice_name ?? "") != "" ? trim(automation.settings.voice_name)
            : (first(filter(outputs.voices ?? [], .voice_id == automation.settings.voice_id))?.name ?? "Default voice") }}
    script:
      type: string
      format: html
      title: What is read
      description: The article's body as the paragraphs that will be read. Change a paragraph's wording, switch one off, or play it in the voice.
      default: "${{ article.body }}"
      ui:
        widget: paragraphs
        paragraphs:
          # Restricted sections are marked as read or not read for the
          # "Preview as" audience.
          audience: preview_audience
          # Keep the body as the web shows it: each isChannel "web" block
          # (passport-wp's full web view beside the shorter distribution
          # view) is reduced to its web branch.
          channel_view: web
          preview_label: Spoken text
          skip_setting: skip_parts
          section_line:
            setting: fallback_text
            label: Read instead
          sample: audio
          term_list:
            setting: pronunciations
            find: term
            replace: say_as
            label: Pronunciation
          # Tags editors can type into the body to direct the delivery, by the
          # model setting; "default" covers the other models. The tags step
          # turns them into what each model understands.
          tags:
            setting: model_id
            title: Voice tags
            sets:
              eleven_v3: &expressive_tags
                note: >-
                  Type a tag in square brackets just before the words it changes.
                  Tags are suggestions, not commands: not every voice responds to
                  every tag (a serious narrator may ignore playful ones), and
                  sounds such as [applause] are the least reliable. Try a
                  paragraph with Listen before publishing.
                groups:
                  - label: Pauses
                    tags:
                      - { tag: "[short pause]" }
                      - { tag: "[pause]" }
                      - { tag: "[long pause]" }
                  - label: Voice
                    tags:
                      - { tag: "[whispers]" }
                      - { tag: "[sighs]" }
                      - { tag: "[exhales]" }
                      - { tag: "[inhales deeply]" }
                      - { tag: "[clears throat]" }
                      - { tag: "[laughs]" }
                      - { tag: "[chuckles]" }
                      - { tag: "[giggles]" }
                      - { tag: "[crying]" }
                      - { tag: "[muttering]" }
                  - label: Emotion and delivery
                    tags:
                      - { tag: "[excited]" }
                      - { tag: "[happy]" }
                      - { tag: "[sad]" }
                      - { tag: "[angry]" }
                      - { tag: "[annoyed]" }
                      - { tag: "[curious]" }
                      - { tag: "[surprised]" }
                      - { tag: "[thoughtful]" }
                      - { tag: "[sarcastic]" }
                      - { tag: "[mischievously]" }
                      - { tag: "[sympathetic]" }
                      - { tag: "[reassuring]" }
                      - { tag: "[professional]" }
                      - { tag: "[deadpan]" }
                      - { tag: "[dramatically]" }
                  - label: Sounds
                    tags:
                      - { tag: "[applause]" }
                      - { tag: "[clapping]" }
                      - { tag: "[gulps]" }
                  - label: Experimental
                    tags:
                      - { tag: "[strong British accent]", hint: "any accent: [strong Irish accent]" }
                      - { tag: "[sings]" }
              eleven_v4: *expressive_tags
              default:
                note: >-
                  This model takes pauses only: [pause] is about a second,
                  [pause 2.5s] sets the length (up to 3 seconds). Too many in one
                  article can make the voice speed up. The other tags (whispers,
                  emotions, sounds) need eleven_v3 or eleven_v4; with this model
                  they are left out. Even there, not every voice responds to
                  every tag.
                groups:
                  - label: Pauses
                    tags:
                      - { tag: "[short pause]", hint: "half a second" }
                      - { tag: "[pause]", hint: "1 second" }
                      - { tag: "[long pause]", hint: "2 seconds" }
                      - { tag: "[pause 1.5s]", hint: "a set length, up to 3s" }

# What a run hands back (run.returns); the admin shows the narration as a
# player. A preview hands back none of this: its result is the preview flow's
# own returns, whose shape Passport fixes (text, characters, limit and note,
# or audio and audio_type).
outputs:
  type: object
  required: [asset_id]
  properties:
    asset_id:
      type: string
      format: passport.asset
      title: Narration
      description: One asset that gives each member the version for their audience. Pick it on a podcast distribution to publish it.
    filename:
      type: string
      title: File name
      description: Named after the article, so a later run keeps the same narration.
    versions:
      type: array
      title: Versions
      description: What was read for each audience.
      items:
        type: object
        properties:
          audience_id: { type: string, format: passport.audience, title: Audience }
          audience: { type: string, title: Audience name }
          filename: { type: string, title: File name }
          characters: { type: integer, title: Characters read }
          characters_billed: { type: integer, title: Characters billed }
          requests: { type: integer, title: Requests }
    characters:
      type: integer
      title: Characters read
      description: Across every version.
    characters_billed:
      type: integer
      title: Characters billed
      description: What ElevenLabs charged for this run, across every version. 0 when it did not say.
    requests:
      type: integer
      title: Requests
      description: How many ElevenLabs requests the run made.
# The preview flow below has its own steps; the two share the preparation
# through narration.text.
run:
  description: >-
    What a person starts from the article's page. It reads the article once
    for each audience chosen and files the MP3s as one narration. The text
    is prepared for every audience before anything is read, so a run that
    cannot finish (nothing to read for one audience, or over the limit)
    fails with nothing sent to ElevenLabs and nothing billed. Running it
    again on the same article replaces the MP3s and keeps the narration's
    id and link.
  steps:
    - id: voice
      name: Pick the voice
      description: >-
        The voice: the form's pick when it is still one of the extension's
        voices, otherwise the default.
      action: set-output
      with:
        id: >-
          ${{ let picked = trim(toString(inputs.voice ?? ""));
          picked != "" && (picked == automation.settings.voice_id || picked in map(automation.settings.voices ?? [], toString(.voice_id)))
          ? picked : automation.settings.voice_id }}

    - id: blocks
      name: Set the patterns for restricted sections
      description: |-
        Swap each restricted block's else branch for the spoken fallback, unless an editor wrote that section's own line ("Read instead"). The patterns and pieces of the replacement are plain strings (no ${{ }}), because an expression cannot contain a literal "}}". The pattern matches an `if hasAnyAudience`/`if audiences` block with no template action nested inside it, with or without an else branch; other blocks (e.g. isChannel "email") are left as they are.

        First, each `if isChannel "web"` block is collapsed to its web branch. passport-wp puts one inside a restricted block's subscriber branch when the block has a distribution view (web view, else the shorter distribution view). Narration reads the full web view, and with the nested block gone the restricted block matches the pattern again. The editor does the same when it loads the text (channel_view); this covers a script that did not come through the editor.
      action: set-output
      with:
        # An `if isChannel "web"` block, with the <template-content> wrapper
        # passport-wp puts around its opening tag; ${1} is the web branch.
        web_pattern: '(?:<template-content>\s*)?\{\{-?\s*if\s+isChannel\s+(?:"|&#34;|&quot;)web(?:"|&#34;|&quot;)\s*-?\}\}(?:\s*</template-content>)?((?:[^{]|\{[^{])*?)(?:\{\{-?\s*else\s*-?\}\}(?:[^{]|\{[^{])*?)?\{\{-?\s*end\s*-?\}\}'
        pattern: '(\{\{-?\s*if\s+(?:hasAnyAudience|audiences)\b(?:[^{]|\{[^{])*?)(?:\{\{-?\s*else\s*-?\}\}(?:[^{]|\{[^{])*?)?\{\{-?\s*end\s*-?\}\}'
        open: "{{ else }}"
        close: "{{ end }}"
        # An else branch that starts with an editor's own line
        # (<p data-text="instead">, or the older data-narration="spoken")
        # keeps it: its else tag is swapped for custom_open first, which the
        # pattern above does not match, then swapped back.
        custom_pattern: '\{\{-?\s*else\s*-?\}\}((?:\s|</[a-zA-Z-]+>|<p>|<template-content>)*<p data-(?:text="instead"|narration="spoken"))'
        custom_open: "{{ narration-else }}"
        # Where the form's text goes in the template setting. A template
        # carried over from v1 marks it {{ .distribution.body }}; both work.
        body_pattern: '\{\{-?\s*\.(?:script|distribution\.body)\s*-?\}\}'
        # The text's own document wrapper (<html>, <head>…</head>, <body>),
        # removed so the template can go in front of it.
        doc_pattern: '(?is)<head\b.*?</head\s*>|</?(?:html|body)\b[^>]*>'

    - id: rewrite
      name: Swap hidden sections for the spoken fallback
      description: >-
        The form's text with each hidden section's else branch swapped for the
        spoken fallback. Left alone, the text is the article's body (the field's
        default).
      action: set-output
      with:
        # "$" is special in a regexReplace replacement, so it is doubled in the
        # publisher's text.
        body: >-
          ${{ let web = regexReplace(steps.blocks.outputs.web_pattern,
          inputs.script ?? "", "${1}");
          let kept = regexReplace(steps.blocks.outputs.custom_pattern,
          web, steps.blocks.outputs.custom_open + "${1}");
          let rewritten = regexReplace(steps.blocks.outputs.pattern, kept,
          "${1}" + steps.blocks.outputs.open
          + (trim(automation.settings.fallback_text ?? "") == "" ? "" : "<p data-narration=\"fallback\">" + replace(trim(automation.settings.fallback_text), "$", "$$") + "</p>")
          + steps.blocks.outputs.close);
          replace(rewritten, steps.blocks.outputs.custom_open, steps.blocks.outputs.open) }}

    - id: compose
      name: Put the text into the template
      description: >-
        Put the text into the template setting, so the two render in one pass (a
        template's {{ .script }} would otherwise come out empty). A template
        without the placeholder is followed by the text; an empty one is just the
        text.
      action: set-output
      with:
        body: >-
          ${{ let body = regexReplace(steps.blocks.outputs.doc_pattern, steps.rewrite.outputs.body, "");
          trim(automation.settings.template ?? "") == "" ? body
          : regexMatch(steps.blocks.outputs.body_pattern, automation.settings.template)
          ? regexReplace(steps.blocks.outputs.body_pattern, automation.settings.template, replace(body, "$", "$$"))
          : automation.settings.template + body }}

    - id: who
      name: Work out who it is read for
      description: >-
        Who is read for: the audiences under "Make audio for". A run without one
        never gets here: the form requires one, and inputs supplied any other way
        are held to the same schema.
      action: set-output
      with:
        audiences: >-
          ${{ filter(map(inputs.audiences ?? [], trim(toString(#))), # != "") }}
        preview: >-
          ${{ let chosen = filter(map(inputs.audiences ?? [], trim(toString(#))), # != "");
          trim(toString(inputs.preview_audience ?? "")) != "" ? trim(toString(inputs.preview_audience))
          : len(chosen) > 0 ? chosen[0] : nil }}

    # From here the text depends on the audience. A run fails, with the reason
  # shown to the person who ran it, when for any audience there is nothing to
  # read or the text is longer than max_characters.

    - id: name
      name: Name the narration's files
      description: >-
        The narration's file name: the article and this extension's short
        name, and nothing that can change (not the title, not the voice), so a
        second run of the same extension finds the same narration and keeps
        its id and link, and another Create Audio Narration extension makes a
        narration of its own. Each audience's MP3 adds the audience's id.
      action: set-output
      with:
        base: >-
          ${{ "narration-" + toString(article.id) + "-" + automation.name }}
        filename: >-
          ${{ "narration-" + toString(article.id) + "-" + automation.name + ".mp3" }}

    - id: prepare
      name: Prepare the text for every audience
      description: >-
        Prepare the text for every audience before anything is read, so a run that
        cannot finish (nothing to read for one audience, or over the limit) fails
        with nothing sent to ElevenLabs and nothing billed.
      foreach: "${{ steps.who.outputs.audiences }}"
      as: audience
      steps:
        - id: named
          name: Look up the audience's name
          description: >-
            The audience's name, for reasons and descriptions a person reads.
          action: audience.get
          with:
            audience_id: "${{ loop.audience }}"
        - id: spoken
          name: Prepare the text this audience hears
          description: >-
            Runs `narration.text` as a member of the audience: rendered, cleaned
            and cut into pieces of one request each.
          action: elevenlabs/narration.text
          with:
            body: "${{ steps.compose.outputs.body }}"
            article_id: "${{ toString(article.id) }}"
            audience_id: "${{ loop.audience }}"
            model_id: "${{ automation.settings.model_id }}"
            skip_parts: "${{ automation.settings.skip_parts }}"
            pronunciations: "${{ automation.settings.pronunciations ?? [] }}"
            text_cleanup: "${{ automation.settings.text_cleanup }}"
        - id: empty
          name: Fail when there is nothing to read
          if: >-
            ${{ steps.spoken.outputs.characters == 0 }}
          action: workflow.fail
          with:
            reason: >-
              ${{ "There is no text to read for " + toString(steps.named.outputs.audience?.name ?? loop.audience)
              + ". Check the text, the paragraphs switched off and the audiences. Nothing was read." }}
        - id: too-long
          name: Fail when the text is over the limit
          if: >-
            ${{ automation.settings.max_characters > 0 && steps.spoken.outputs.characters > automation.settings.max_characters }}
          action: workflow.fail
          with:
            reason: >-
              ${{ "The text for " + toString(steps.named.outputs.audience?.name ?? loop.audience)
              + " is " + toString(steps.spoken.outputs.characters)
              + " characters, over the limit of " + toString(automation.settings.max_characters)
              + " (Longest article to read). Shorten the text or raise the limit. Nothing was read." }}
        - id: planned
          name: Keep the prepared text for the reading
          description: >-
            Adds this audience's pieces to `vars.versions`, which the next loop
            reads.
          action: vars.set
          with:
            versions: >-
              ${{ concat(vars.versions ?? [], [({
              "audience_id": toString(loop.audience),
              "audience": toString(steps.named.outputs.audience?.name ?? loop.audience),
              "filename": steps.name.outputs.base + "-" + toString(loop.audience) + ".mp3",
              "chunks": steps.spoken.outputs.chunks,
              "characters": steps.spoken.outputs.characters,
              "text_hash": sha256(steps.spoken.outputs.text + "|" + steps.voice.outputs.id + "|" + automation.settings.model_id)
              })]) }}

    - id: generate
      name: Read each audience's text to its own MP3
      description: |-
        Read each audience's text to its own MP3, a protected asset only that audience's members (and admins) can fetch: narration-<article id>-<short name>-<audience id>.mp3. overwrite keeps the asset's id across runs, and an MP3 is only replaced once every piece of it has been read, so a run that fails partway leaves the versions it did not reach, and the narration, as they were. Every request that reaches ElevenLabs is billed.

        text_hash is kept on the asset (metadata.narration) to tell what it was made from. A run never skips on it: a person asked for this run.
      foreach: "${{ vars.versions }}"
      as: version
      steps:
        - id: narration
          name: Read the text into the MP3
          description: >-
            Runs `narration.create`: one request per piece, joined into
            `narration-<article id>-<short name>-<audience id>.mp3`.
          action: elevenlabs/narration.create
          with:
            chunks: "${{ loop.version.chunks }}"
            voice_id: "${{ steps.voice.outputs.id }}"
            model_id: "${{ automation.settings.model_id }}"
            filename: "${{ loop.version.filename }}"
            audience_id: "${{ loop.version.audience_id }}"
            description: "Narration of ${{ article.title ?? article.id }} for ${{ loop.version.audience }}"
            narration:
              article_id: "${{ toString(article.id) }}"
              voice_id: "${{ steps.voice.outputs.id }}"
              model_id: "${{ automation.settings.model_id }}"
              text_hash: "${{ loop.version.text_hash }}"
        - id: made
          name: Note the MP3 that was made
          description: >-
            Adds the MP3 to `vars.variants` and `vars.results`, for the virtual
            asset and for what the run hands back.
          action: vars.set
          with:
            variants: >-
              ${{ concat(vars.variants ?? [], [({
              "asset_id": steps.narration.outputs.asset_id,
              "audience_id": loop.version.audience_id})]) }}
            results: >-
              ${{ concat(vars.results ?? [], [({
              "audience_id": loop.version.audience_id,
              "audience": loop.version.audience,
              "filename": loop.version.filename,
              "characters": loop.version.characters,
              "characters_billed": steps.narration.outputs.characters_billed,
              "requests": steps.narration.outputs.requests})]) }}

    - id: virtual
      name: File the MP3s as one narration
      description: >-
        File the MP3s as the versions of one narration: a virtual asset,
        narration-<article id>-<short name>.mp3, that answers each member with the MP3 for
        their audience. A narration that is already there is given this run's
        versions in place of the ones it had and keeps its id and link. No
        default: a member in none of the audiences gets no audio. An audience left
        out of this run is no longer a version; its MP3 is left under Assets,
        still for that audience only.
      action: asset.virtual
      with:
        filename: "${{ steps.name.outputs.filename }}"
        description: "Narration of ${{ article.title ?? article.id }}"
        variants: "${{ vars.variants }}"

  returns:
    asset_id: "${{ steps.virtual.outputs.asset_id }}"
    filename: "${{ steps.name.outputs.filename }}"
    versions: "${{ vars.results }}"
    characters: "${{ sum(map(vars.results, .characters)) }}"
    characters_billed: "${{ sum(map(vars.results, .characters_billed)) }}"
    requests: "${{ sum(map(vars.results, .requests)) }}"

# Having this flow is what makes the extension answer previews. It may only
# read and call ElevenLabs: the check refuses a step that would change
# anything.
preview:
  description: >-
    What the form's paragraph editor asks for while a person is still
    filling the form in. With no sample (the **Spoken text** button) it
    returns the text a run would read for the preview audience; with a
    sample (a paragraph's play button) it reads that one paragraph aloud
    and returns the MP3. It reads the form as it is on screen and the
    extension's settings as they are being edited, saves nothing and is not
    recorded. A paragraph played is billed by ElevenLabs.
  steps:
    - id: mode
      name: Work out which preview was asked for
      description: >-
        Which preview was asked for: "text" (what would be read: the form's
        Spoken text button) or "listen" (read trigger.preview.sample, the
        paragraph whose play button was pressed).
      action: set-output
      with:
        mode: >-
          ${{
          trim(trigger.preview?.sample ?? "") != "" ? "listen" : "text" }}

    - id: voice
      name: Pick the voice
      description: >-
        The voice: the form's pick, as the form is on screen, when it is still
        one of the extension's voices, otherwise the default.
      action: set-output
      with:
        id: >-
          ${{ let picked = trim(toString(inputs.voice ?? ""));
          picked != "" && (picked == automation.settings.voice_id || picked in map(automation.settings.voices ?? [], toString(.voice_id)))
          ? picked : automation.settings.voice_id }}

    - id: blocks
      name: Set the patterns for restricted sections
      description: |-
        Swap each restricted block's else branch for the spoken fallback, unless an editor wrote that section's own line ("Read instead"). The patterns and pieces of the replacement are plain strings (no ${{ }}), because an expression cannot contain a literal "}}". The pattern matches an `if hasAnyAudience`/`if audiences` block with no template action nested inside it, with or without an else branch; other blocks (e.g. isChannel "email") are left as they are.

        First, each `if isChannel "web"` block is collapsed to its web branch. passport-wp puts one inside a restricted block's subscriber branch when the block has a distribution view (web view, else the shorter distribution view). Narration reads the full web view, and with the nested block gone the restricted block matches the pattern again. The editor does the same when it loads the text (channel_view); this covers a script that did not come through the editor.
      action: set-output
      with:
        # An `if isChannel "web"` block, with the <template-content> wrapper
        # passport-wp puts around its opening tag; ${1} is the web branch.
        web_pattern: '(?:<template-content>\s*)?\{\{-?\s*if\s+isChannel\s+(?:"|&#34;|&quot;)web(?:"|&#34;|&quot;)\s*-?\}\}(?:\s*</template-content>)?((?:[^{]|\{[^{])*?)(?:\{\{-?\s*else\s*-?\}\}(?:[^{]|\{[^{])*?)?\{\{-?\s*end\s*-?\}\}'
        pattern: '(\{\{-?\s*if\s+(?:hasAnyAudience|audiences)\b(?:[^{]|\{[^{])*?)(?:\{\{-?\s*else\s*-?\}\}(?:[^{]|\{[^{])*?)?\{\{-?\s*end\s*-?\}\}'
        open: "{{ else }}"
        close: "{{ end }}"
        # An else branch that starts with an editor's own line
        # (<p data-text="instead">, or the older data-narration="spoken")
        # keeps it: its else tag is swapped for custom_open first, which the
        # pattern above does not match, then swapped back.
        custom_pattern: '\{\{-?\s*else\s*-?\}\}((?:\s|</[a-zA-Z-]+>|<p>|<template-content>)*<p data-(?:text="instead"|narration="spoken"))'
        custom_open: "{{ narration-else }}"
        # Where the form's text goes in the template setting. A template
        # carried over from v1 marks it {{ .distribution.body }}; both work.
        body_pattern: '\{\{-?\s*\.(?:script|distribution\.body)\s*-?\}\}'
        # The text's own document wrapper (<html>, <head>…</head>, <body>),
        # removed so the template can go in front of it.
        doc_pattern: '(?is)<head\b.*?</head\s*>|</?(?:html|body)\b[^>]*>'

    - id: rewrite
      name: Swap hidden sections for the spoken fallback
      description: >-
        The form's text as it is on screen, with each hidden section's else
        branch swapped for the spoken fallback. Left alone, the text is the
        article's body (the field's default). Not needed to play one paragraph.
      if: >-
        ${{ steps.mode.outputs.mode != "listen" }}
      action: set-output
      with:
        # "$" is special in a regexReplace replacement, so it is doubled in the
        # publisher's text.
        body: >-
          ${{ let web = regexReplace(steps.blocks.outputs.web_pattern,
          inputs.script ?? "", "${1}");
          let kept = regexReplace(steps.blocks.outputs.custom_pattern,
          web, steps.blocks.outputs.custom_open + "${1}");
          let rewritten = regexReplace(steps.blocks.outputs.pattern, kept,
          "${1}" + steps.blocks.outputs.open
          + (trim(automation.settings.fallback_text ?? "") == "" ? "" : "<p data-narration=\"fallback\">" + replace(trim(automation.settings.fallback_text), "$", "$$") + "</p>")
          + steps.blocks.outputs.close);
          replace(rewritten, steps.blocks.outputs.custom_open, steps.blocks.outputs.open) }}

    - id: compose
      name: Put the text into the template
      description: >-
        Put the text into the template setting, so the two render in one pass (a
        template's {{ .script }} would otherwise come out empty). A template
        without the placeholder is followed by the text; an empty one is just the
        text. Not needed to play one paragraph.
      if: >-
        ${{ steps.mode.outputs.mode != "listen" }}
      action: set-output
      with:
        body: >-
          ${{ let body = regexReplace(steps.blocks.outputs.doc_pattern, steps.rewrite.outputs.body, "");
          trim(automation.settings.template ?? "") == "" ? body
          : regexMatch(steps.blocks.outputs.body_pattern, automation.settings.template)
          ? regexReplace(steps.blocks.outputs.body_pattern, automation.settings.template, replace(body, "$", "$$"))
          : automation.settings.template + body }}

    - id: who
      name: Work out who it is read for
      description: >-
        Who is read for. The form refuses an empty or repeated list; a preview is
        not held to it. The preview audience is "Preview as", else the first
        audience chosen, else none (the text is then rendered for nobody in
        particular).
      action: set-output
      with:
        audiences: >-
          ${{ filter(map(inputs.audiences ?? [], trim(toString(#))), # != "") }}
        preview: >-
          ${{ let chosen = filter(map(inputs.audiences ?? [], trim(toString(#))), # != "");
          trim(toString(inputs.preview_audience ?? "")) != "" ? trim(toString(inputs.preview_audience))
          : len(chosen) > 0 ? chosen[0] : nil }}

    # From here the text depends on the audience. narration.text renders
    #    the composed body as a member of one audience (and of every audience
    #    ranked below it), turns it into the text that is read, applies the
    #    pronunciations, the cleanup and the voice tags, and cuts it into
    #    pieces of one request each. It reads only, so a preview may run it.
    #    While a pronunciation is being edited in the form, a preview's
    #    automation.settings holds the unsaved list (guide 5.7).

    - id: preview-text
      name: "Preview: return the text a run would read"
      description: >-
        The form's Spoken text button: return what a run would read for the
        preview audience. Changes nothing.
      if: >-
        ${{ steps.mode.outputs.mode == "text" }}
      then:
        - id: preview-spoken
          name: Prepare the text for the preview audience
          description: >-
            Runs `narration.text` for the audience under **Preview as**: the same
            preparation a run makes.
          action: elevenlabs/narration.text
          with:
            body: "${{ steps.compose.outputs.body }}"
            article_id: "${{ toString(article.id) }}"
            audience_id: "${{ steps.who.outputs.preview }}"
            model_id: "${{ automation.settings.model_id }}"
            skip_parts: "${{ automation.settings.skip_parts }}"
            pronunciations: "${{ automation.settings.pronunciations ?? [] }}"
            text_cleanup: "${{ automation.settings.text_cleanup }}"
        - id: previewed
          name: Hand back the text and its length
          description: >-
            The named outputs are what the flow's returns hand back: the text,
            how many characters it is, the limit the editor flags it against, and
            a note when it would take more than one request.
          action: set-output
          with:
            done: true
          outputs:
            text: "${{ steps.preview-spoken.outputs.text }}"
            characters: "${{ steps.preview-spoken.outputs.characters }}"
            # the editor flags text over limit; 0 is no limit
            limit: "${{ automation.settings.max_characters }}"
            note: >-
              ${{ steps.preview-spoken.outputs.requests > 1 ? "Read in " + toString(steps.preview-spoken.outputs.requests)
              + " requests to " + automation.settings.model_id + ", joined into one MP3" : "" }}

    - id: preview-listen
      name: "Preview: read one paragraph aloud"
      description: >-
        A paragraph's play button: read the sample in the voice and return the
        MP3 as base64. The sample is a paragraph's text as the editor shows it, so
        it is not rendered and no audience is needed. Nothing is saved; billed.
      if: >-
        ${{ steps.mode.outputs.mode == "listen" }}
      then:
        - id: sample-spoken
          name: Prepare the sample
          description: >-
            The paragraph goes through the pronunciations, the cleanup and the
            voice tags, and is not rendered.
          action: elevenlabs/narration.text
          with:
            sample: "${{ trigger.preview.sample }}"
            model_id: "${{ automation.settings.model_id }}"
            pronunciations: "${{ automation.settings.pronunciations ?? [] }}"
            text_cleanup: "${{ automation.settings.text_cleanup }}"
        - id: sample-too-long
          name: Refuse a sample over 2,000 characters
          if: >-
            ${{ steps.sample-spoken.outputs.characters > 2000 }}
          action: workflow.fail
          with:
            reason: "A sample is at most 2,000 characters; this one is ${{ steps.sample-spoken.outputs.characters }}."
        - id: sample
          name: Read the sample in the voice
          description: >-
            One request to ElevenLabs, billed. The MP3 comes back as base64 in the
            named outputs and is not saved.
          action: elevenlabs/speech.sample
          with:
            voice_id: "${{ steps.voice.outputs.id }}"
            model_id: "${{ automation.settings.model_id }}"
            text: "${{ steps.sample-spoken.outputs.text }}"
          outputs:
            audio: "${{ steps.sample.outputs.audio }}"
            audio_type: "${{ steps.sample.outputs.audio_type }}"
            text: "${{ steps.sample-spoken.outputs.text }}"

  # The fixed result of an extension's preview
  # (passport/schemas/extension.preview.result@1). Only one of the two
  # branches ran, so the other's values are absent and left out.
  returns:
    text: "${{ outputs.text }}"
    characters: "${{ outputs.characters }}"
    limit: "${{ outputs.limit }}"
    note: "${{ outputs.note }}"
    audio: "${{ outputs.audio }}"
    audio_type: "${{ outputs.audio_type }}"
