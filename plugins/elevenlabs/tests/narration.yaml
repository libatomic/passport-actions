# Test cases for channels/narration.yaml. Dry runs only: every step that
# would reach ElevenLabs or change Passport is sampled. Never put a real API
# key here.
cases:
  - name: Publish
    settings: {}
    secrets: { api_key: test }
    channel:
      label: Narration
      settings: &channel_settings
        voice_id: JBFqnCBsd6RMkjVDRZzb
        voice_name: George
        voices:
          - { label: Rachel, voice_id: 21m00Tcm4TlvDq8ikWAM }
        model_id: eleven_flash_v2_5
        max_characters: 0
        pronunciations:
          - { term: Wemby, say_as: Wem-bee }
        text_cleanup: true
    trigger: { action: publish, distribution_id: 0d6c2f0e-6c1b-4c53-9a7e-6f3b0c1e9a11 }
    # The whole record, as the channel reads it: _id names the file and
    # article_id goes into the asset's metadata.
    distribution: &distribution
      _id: 887
      id: 0d6c2f0e-6c1b-4c53-9a7e-6f3b0c1e9a11
      article_id: 9a1d3c44-0b7e-4f0b-a1c5-7f1e2d3c4b5a
      title: Fishing the Ozarks
      audience_id: 4b0a8d5e-1f0f-4c6f-8f43-2d2a9c0f7e21
      body: "<p>Wemby scored 30 in a 112-108 win.</p><p>The team is No. 1.</p>"
      context: {}
    article: { title: Fishing the Ozarks, summary: A weekend on the White River. }
    fields: { voice: 21m00Tcm4TlvDq8ikWAM }
    samples:
      steps:
        render:
          title: Fishing the Ozarks
          body: "<p>Fishing the Ozarks was published on Saturday, November 14, 2026. [long pause]</p><p>Wemby scored 30 in a 112-108 win.</p><p>The team is No. 1.</p>"
        # tts runs inside the foreach: one entry per pass, the last repeated.
        # Sampling the step that calls speech.create means the action's own
        # http.post does not run.
        tts:
          - { asset_id: 11111111-1111-4111-8111-111111111111, size: 48211, characters_billed: 118 }
        join: { asset_id: 22222222-2222-4222-8222-222222222222, size: 52307, parts: 1, deleted: 1 }
        record: {}
    expect:
      status: success
      steps:
        mode: { outputs: { mode: run } }
        voice: { outputs: { id: 21m00Tcm4TlvDq8ikWAM } }
        tags:
          outputs:
            text: |-
              Fishing the Ozarks was published on Saturday, November 14, 2026. <break time="2s" />

              Wem-bee scored 30 in a 112 to 108 win.

              The team is number 1.
        name: { outputs: { filename: Fishing_the_Ozarks-887.mp3 } }
      not_run: [remove, previewed, sample, current, replaced]

  - name: Preview the spoken text
    secrets: { api_key: test }
    channel: { settings: *channel_settings }
    trigger:
      action: preview
      distribution_id: 0d6c2f0e-6c1b-4c53-9a7e-6f3b0c1e9a11
      preview:
        body: "<p>An unsaved edit, 50% done.</p>"
    distribution: *distribution
    fields: {}
    samples:
      steps:
        render:
          title: Fishing the Ozarks
          body: "<p>An unsaved edit, 50% done.</p>"
    expect:
      status: success
      outputs:
        text: An unsaved edit, 50 percent done.
        limit: 0
        note: ""
      not_run: [sample, tts, join, replaced, record]

  - name: Preview a spoken sample
    secrets: { api_key: test }
    channel: { settings: *channel_settings }
    trigger:
      action: preview
      distribution_id: 0d6c2f0e-6c1b-4c53-9a7e-6f3b0c1e9a11
      preview:
        sample: "Wemby vs. the field"
    distribution: *distribution
    fields: {}
    samples:
      steps:
        sample: { audio: "SUQzBAAAAAAA", audio_type: audio/mpeg }
    expect:
      status: success
      outputs:
        audio: "SUQzBAAAAAAA"
        audio_type: audio/mpeg
        text: Wem-bee versus the field
      not_run: [render, tts, join, replaced, record]

  - name: A sample over 2,000 characters is refused
    secrets: { api_key: test }
    channel: { settings: *channel_settings }
    trigger:
      action: preview
      distribution_id: 0d6c2f0e-6c1b-4c53-9a7e-6f3b0c1e9a11
      preview:
        # 2,047 characters
        sample: "This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read. This sentence is repeated until the sample is too long to read."
    distribution: *distribution
    fields: {}
    expect:
      status: failed
      reason: A sample is at most 2,000 characters
      not_run: [render, sample, tts, join, replaced, record]

  - name: Delete removes the MP3
    secrets: { api_key: test }
    channel: { settings: *channel_settings }
    trigger: { action: delete, distribution_id: 0d6c2f0e-6c1b-4c53-9a7e-6f3b0c1e9a11 }
    distribution:
      _id: 887
      id: 0d6c2f0e-6c1b-4c53-9a7e-6f3b0c1e9a11
      article_id: 9a1d3c44-0b7e-4f0b-a1c5-7f1e2d3c4b5a
      title: Fishing the Ozarks
      audience_id: 4b0a8d5e-1f0f-4c6f-8f43-2d2a9c0f7e21
      body: "<p>Wemby scored 30 in a 112-108 win.</p><p>The team is No. 1.</p>"
      context: { asset_id: 22222222-2222-4222-8222-222222222222 }
    fields: {}
    samples:
      steps:
        remove: { id: 22222222-2222-4222-8222-222222222222, deleted: true }
    expect:
      status: success
      steps:
        remove: { status: ok }
      not_run: [render, sample, tts, join, replaced, record]
