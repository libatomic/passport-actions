# Test cases for actions/voices.list.yaml. Dry runs: the call to ElevenLabs
# is sampled. Never put a real API key here.
cases:
  - name: Lists the account's voices
    secrets: { api_key: test }
    samples:
      actions:
        http.get:
          status: 200
          body:
            voices:
              - { voice_id: JBFqnCBsd6RMkjVDRZzb, name: George, category: premade, high_quality_base_model_ids: [eleven_flash_v2_5] }
              - { voice_id: 21m00Tcm4TlvDq8ikWAM, name: Rachel, category: premade, high_quality_base_model_ids: [eleven_flash_v2_5] }
    expect:
      status: success
      outputs:
        voices:
          - { voice_id: JBFqnCBsd6RMkjVDRZzb, name: George, category: premade, models: [eleven_flash_v2_5] }
          - { voice_id: 21m00Tcm4TlvDq8ikWAM, name: Rachel, category: premade, models: [eleven_flash_v2_5] }
