format: 2
id: elevenlabs
name: ElevenLabs Narration
description: >-
  Reads articles aloud with an ElevenLabs voice. Adds Create Audio Narration
  to an article's Extensions menu: running it makes one narration that gives
  each member the MP3 read for their audience.
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/account-voice.svg
category: audio
visibility: public
requires:
  passport: "^2.3.0"
allowed_hosts:
  - api.elevenlabs.io
settings:
  type: object
  required: [api_key]
  properties:
    api_key:
      type: string
      title: ElevenLabs API key
      description: A restricted key with Text to Speech access, Voices read and User read.
      help: |
        Create it in ElevenLabs under **Developers, API keys**. Restrict it to:

        - Text to Speech: Access
        - Voices: Read
        - User: Read

        Create Audio Narration and every helper in this plugin use this one key.
      secret: true
test: ping
