cases:
  - name: Cancellation scheduled
    settings: { client_id: "0123456789abcdef0123456789abcdef" }
    secrets: { api_key: test }
    automation: { settings: { list_id: "a1b2c3d4e5f60718293a4b5c6d7e8f90" } }
    trigger:
      type: user.subscription.updated
      user_id: "9f1c2d3e-0000-4000-8000-000000000001"
      body: { subscription_id: "5a5a5a5a-0000-4000-8000-000000000002", auto_renew: false, cancel_at: "2026-12-31T00:00:00Z", recurring_interval: year }
    inputs: {}
    samples:
      steps:
        load-user: { user: { id: "9f1c2d3e-0000-4000-8000-000000000001", login: ada@example.com, created_at: "2026-03-09T10:15:00Z", profile: { email: ada@example.com, name: Ada Lovelace } } }
      actions:
        http.put: { status: 200, body: "" }
    expect: { status: success }

  - name: Auto-renew turned back on
    settings: { client_id: "0123456789abcdef0123456789abcdef" }
    secrets: { api_key: test }
    automation: { settings: { list_id: "a1b2c3d4e5f60718293a4b5c6d7e8f90" } }
    trigger:
      type: user.subscription.updated
      user_id: "9f1c2d3e-0000-4000-8000-000000000001"
      body: { subscription_id: "5a5a5a5a-0000-4000-8000-000000000002", auto_renew: true }
    inputs: {}
    samples:
      steps:
        load-user: { user: { id: "9f1c2d3e-0000-4000-8000-000000000001", login: ada@example.com, created_at: "2026-03-09T10:15:00Z", profile: { email: ada@example.com, name: Ada Lovelace } } }
      actions:
        http.put: { status: 200, body: "" }
    expect: { status: success }
