name: cm-webhook-register
version: "1.1"
description: Manage a webhook on a Campaign Monitor list — register (idempotent), unregister, or list what's registered

inputs:
  api_key:
    secret: true
    required: true
    type: string
    label: API Key
    description: Campaign Monitor API key (or use secrets.CM_API_KEY)
  list_id:
    required: true
    type: string
    label: List ID
    description: Campaign Monitor list ID to act on
  action:
    required: false
    type: string
    default: "register"
    label: Action
    description: register (default), unregister, or list
  url:
    required: false
    type: string
    default: ""
    label: Webhook URL
    description: Destination URL to register or unregister (not needed for list)
  events:
    required: false
    type: array
    default: ["Deactivate"]
    label: Events
    description: CM events to subscribe to (Subscribe, Update, Deactivate)
  payload_format:
    required: false
    type: string
    default: "json"
    label: Payload Format
    description: json or xml

steps:
  # Always fetch what's registered: it's the register idempotency check, the
  # unregister URL→WebhookID lookup, and the entire payload of the list action.
  - id: existing
    action: http.get
    with:
      url: "https://api.createsend.com/api/v3.3/lists/${{ inputs.list_id }}/webhooks.json"
      headers:
        Authorization: "Basic ${{ base64Encode(inputs.api_key + ':x') }}"
      expect_status: [200]

  - id: register
    if: ${{ inputs.action == "register" && inputs.url != "" && !any(steps.existing.outputs.body, {.Url == inputs.url}) }}
    action: http.post
    with:
      url: "https://api.createsend.com/api/v3.3/lists/${{ inputs.list_id }}/webhooks.json"
      headers:
        Authorization: "Basic ${{ base64Encode(inputs.api_key + ':x') }}"
        Content-Type: application/json
      body:
        Events: ${{ inputs.events }}
        Url: ${{ inputs.url }}
        PayloadFormat: ${{ inputs.payload_format }}
      expect_status: [201]

  - id: unregister
    if: ${{ inputs.action == "unregister" && inputs.url != "" && any(steps.existing.outputs.body, {.Url == inputs.url}) }}
    action: http.delete
    with:
      url: "https://api.createsend.com/api/v3.3/lists/${{ inputs.list_id }}/webhooks/${{ first(filter(steps.existing.outputs.body, {.Url == inputs.url})).WebhookID }}.json"
      headers:
        Authorization: "Basic ${{ base64Encode(inputs.api_key + ':x') }}"
      expect_status: [200]
