name: spotify-update-episode
version: "1.1"
description: >
  Update an existing Spotify episode via the Distribution API
  (pinned to Api-Version 2026-04-01). Partial update — only the
  provided fields are sent.

inputs:
  api_version:
    default: "2026-04-01"
    type: string
    label: API Version
    description: >
      CalVer date of the Distribution API version to use (Api-Version header).
      Spotify resolves it to the latest version on or before this date; without
      it, the API defaults to the version current when the credentials were
      issued.
  client_id:
    required: true
    type: string
    label: Client ID
    description: Spotify application client id (or use secrets.SPOTIFY_CLIENT_ID).
  client_secret:
    secret: true
    required: true
    type: string
    label: Client Secret
    description: Spotify application client secret (or use secrets.SPOTIFY_CLIENT_SECRET).
  episode_id:
    required: true
    type: string
    label: Episode ID
    description: >
      Spotify episode id — the base-62 id at the end of the episode URI
      (spotify:episode:<id>).
  media_file_url:
    default: ""
    type: string
    label: Media File URL
    description: >
      New media URL. This is the field to set when backfilling an existing
      audio episode with its video version (MP4/MOV).
  title:
    default: ""
    type: string
    label: Title
  pubdate:
    default: ""
    type: string
    label: Publish Date
    description: ISO8601 (e.g. 2026-06-01T14:54:02.690Z).
  summary:
    default: ""
    type: string
    label: Summary
  link:
    default: ""
    type: string
    label: Link
  image_file_url:
    default: ""
    type: string
    label: Episode Art URL
  explicit:
    default: ""
    type: string
    label: Explicit
    enum:
      - ""
      - "no"
      - "yes"
      - clean
  content_rating:
    default: ""
    type: string
    label: Content Rating
    enum:
      - ""
      - unspecified
      - eighteen_plus
  episode_type:
    default: ""
    type: string
    label: Episode Type
    enum:
      - ""
      - full
      - bonus
      - trailer
  episode_number:
    default: ""
    type: string
    label: Episode Number
    description: Integer; sent as a number, omitted when empty.
  season_number:
    default: ""
    type: string
    label: Season Number
    description: Integer; sent as a number, omitted when empty.
  entitlements:
    default: []
    type: list
    label: Entitlements
    description: >
      Spotify Open Access entitlement identifiers (category slugs). Omitted
      when empty so an update without entitlements doesn't clear the
      episode's gating — unless clear_entitlements is true.
  clear_entitlements:
    default: false
    type: boolean
    label: Clear Entitlements When Empty
    description: >
      When true, an empty entitlements list is sent as [] so the episode
      becomes open (ungated). Use when the caller owns the episode's gating,
      e.g. a distribution republish that recomputes entitlements from the
      audience.

steps:
  - id: token
    action: http.post
    with:
      url: "https://accounts.spotify.com/api/token"
      headers:
        Authorization: "Basic ${{ base64Encode(inputs.client_id + ':' + inputs.client_secret) }}"
        Content-Type: application/x-www-form-urlencoded
      body: "grant_type=client_credentials"
      expect_status: [200]

  # The update is a partial write: every field is optional, so send only the
  # attributes that were provided — the engine does NOT drop empty values on
  # its own, and the 2026-04-01 API types episode_number/season_number as
  # integers. Empty inputs are omitted from the payload entirely.
  - id: payload
    action: set-output
    with:
      body: >-
        ${{ merge(ternary(empty(inputs.title), {}, {"title": inputs.title}),
        ternary(empty(inputs.pubdate), {}, {"pubdate": inputs.pubdate}),
        ternary(empty(inputs.media_file_url), {}, {"media_file_url": inputs.media_file_url}),
        ternary(empty(inputs.summary), {}, {"summary": inputs.summary}),
        ternary(empty(inputs.link), {}, {"link": inputs.link}),
        ternary(empty(inputs.image_file_url), {}, {"image_file_url": inputs.image_file_url}),
        ternary(empty(inputs.explicit), {}, {"explicit": inputs.explicit}),
        ternary(empty(inputs.content_rating), {}, {"content_rating": inputs.content_rating}),
        ternary(empty(inputs.episode_type), {}, {"episode_type": inputs.episode_type}),
        ternary(empty(inputs.episode_number), {}, {"episode_number": toInt(inputs.episode_number)}),
        ternary(empty(inputs.season_number), {}, {"season_number": toInt(inputs.season_number)}),
        ternary(empty(inputs.entitlements) && !toBool(inputs.clear_entitlements), {}, {"entitlements": inputs.entitlements ?? []})) }}

  - id: episode
    action: http.put
    with:
      url: "https://distribution.spotify.com/episodes/${{ inputs.episode_id }}"
      headers:
        Authorization: "Bearer ${{ steps.token.outputs.body.access_token }}"
        Content-Type: application/json
        Api-Version: ${{ inputs.api_version }}
      body: ${{ steps.payload.outputs.body }}
      expect_status: [200]
