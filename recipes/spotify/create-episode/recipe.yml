name: spotify-create-episode
version: "1.1"
description: >
  Publish an episode to a Spotify show via the Distribution API
  (pinned to Api-Version 2026-04-01).

inputs:
  api_version:
    default: "2026-04-01"
    type: string
    label: API Version
    description: >
      CalVer date of the Distribution API version to use (Api-Version header).
      Spotify resolves it to the latest version on or before this date; without
      it, the API defaults to the version current when the credentials were
      issued.
  client_id:
    required: true
    type: string
    label: Client ID
    description: Spotify application client id (or use secrets.SPOTIFY_CLIENT_ID).
  client_secret:
    secret: true
    required: true
    type: string
    label: Client Secret
    description: >
      Spotify application client secret (or use secrets.SPOTIFY_CLIENT_SECRET).
      Used with the client id for the client-credentials token exchange.
  show_id:
    required: true
    type: string
    label: Show ID
    description: >
      Spotify show id — the base-62 id at the end of the show URI
      (spotify:show:<id>), not the full URI.
  title:
    required: true
    type: string
    label: Title
    description: Episode name.
  pubdate:
    required: true
    type: string
    label: Publish Date
    description: Publication date/time in ISO8601 (e.g. 2026-06-01T14:54:02.690Z).
  media_file_url:
    required: true
    type: string
    label: Media File URL
    description: >
      Public URL to the episode media. MP3, M4A, MP4 or MOV; MP4/MOV are
      published as video. Must be reachable by Spotify.
  content_rating:
    required: true
    default: unspecified
    type: string
    label: Content Rating
    description: >
      Whether the video is intended for 18+ audiences. Only meaningful for
      video episodes.
    enum:
      - unspecified
      - eighteen_plus
  explicit:
    default: "no"
    type: string
    label: Explicit
    description: Whether the episode contains explicit content.
    enum:
      - "no"
      - "yes"
      - clean
  summary:
    default: ""
    type: string
    label: Summary
    description: Episode summary — plain text or HTML.
  guid:
    required: true
    type: string
    label: GUID
    description: >
      Unique identifier for the episode (required by the API). Pass a stable
      value (e.g. the distribution id) so re-publishes map to the same episode.
  link:
    default: ""
    type: string
    label: Link
    description: Link to the episode's webpage.
  image_file_url:
    default: ""
    type: string
    label: Episode Art URL
    description: Episode artwork. Recommended 3000x3000 JPEG/PNG, 72dpi, RGB.
  episode_type:
    default: full
    type: string
    label: Episode Type
    enum:
      - full
      - bonus
      - trailer
  episode_number:
    default: ""
    type: string
    label: Episode Number
    description: >
      Optional integer. Leave empty to let Spotify order by publish date —
      empty is omitted from the request (the API types this as an integer).
  season_number:
    default: ""
    type: string
    label: Season Number
    description: Optional integer. Empty is omitted from the request.
  entitlements:
    default: []
    type: list
    label: Entitlements
    description: >
      Spotify Open Access entitlement identifiers gating this episode — the
      audience's category slugs. Empty publishes an ungated episode.

steps:
  # Client-credentials token exchange. Spotify's token endpoint takes Basic auth
  # (client id + secret) and a form-encoded grant_type.
  - id: token
    action: http.post
    with:
      url: "https://accounts.spotify.com/api/token"
      headers:
        Authorization: "Basic ${{ base64Encode(inputs.client_id + ':' + inputs.client_secret) }}"
        Content-Type: application/x-www-form-urlencoded
      body: "grant_type=client_credentials"
      expect_status: [200]

  # The 2026-04-01 API types episode_number/season_number as integers and
  # optional URL fields must be valid when present — build the payload so
  # empty optional fields are omitted entirely rather than sent as "".
  - id: payload
    action: set-output
    with:
      base:
        title: ${{ inputs.title }}
        pubdate: ${{ inputs.pubdate }}
        media_file_url: ${{ inputs.media_file_url }}
        summary: ${{ inputs.summary }}
        guid: ${{ inputs.guid }}
        explicit: ${{ inputs.explicit }}
        content_rating: ${{ inputs.content_rating }}
        episode_type: ${{ inputs.episode_type }}
        entitlements: ${{ inputs.entitlements }}
      extra: >-
        ${{ merge(ternary(empty(inputs.link), {}, {"link": inputs.link}),
        ternary(empty(inputs.image_file_url), {}, {"image_file_url": inputs.image_file_url}),
        ternary(empty(inputs.episode_number), {}, {"episode_number": toInt(inputs.episode_number)}),
        ternary(empty(inputs.season_number), {}, {"season_number": toInt(inputs.season_number)})) }}

  - id: episode
    action: http.post
    with:
      url: "https://distribution.spotify.com/shows/${{ inputs.show_id }}/episodes"
      headers:
        Authorization: "Bearer ${{ steps.token.outputs.body.access_token }}"
        Content-Type: application/json
        Api-Version: ${{ inputs.api_version }}
      body: ${{ merge(steps.payload.outputs.base, steps.payload.outputs.extra) }}
      expect_status: [200, 201]
