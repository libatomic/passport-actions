name: Register Opt-Out Webhook (Campaign Monitor)
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/link-plus.svg
description: |
  One-time setup companion for the Opt-Out Webhook blueprint. Campaign Monitor
  has no UI for list webhooks, so this workflow registers the opt-out webhook
  URL on a CM list via the CM API — no curl required.

  Installed via the Campaign Monitor package, the installer generates the
  Opt-Out Webhook workflow's URL, fills it in here, and runs the registration
  automatically — nothing to do. Installed standalone, run it manually once per
  list: paste the webhook URL from the Opt-Out Webhook workflow's detail page
  (Webhook URLs section) and the CM list ID. The registration is idempotent —
  if the URL is already registered on the list the create call is skipped, so
  re-running is safe.

  The Action input also supports "unregister" (remove the webhook from the
  list — run automatically when the Opt-Out Webhook workflow is deleted from
  the admin UI, so CM stops posting to a dead URL) and "list" (log every
  webhook registered on the list, for auditing).

  Requires the CM_API_KEY secret and api.createsend.com on the allowed HTTP
  hosts list. Registers Deactivate events (unsubscribes, spam complaints, hard
  bounces, deletes) and Subscribe events (subscriber added, re-added, or
  restored), matching the two-way consent sync in the Opt-Out Webhook
  blueprint.

  NOTE: the register call is idempotent BY URL — it will not update the event
  set of an already-registered webhook. To pick up an events change on an
  existing registration, run unregister and then register again.
category: campaign-monitor
inputs:
  list_id:
    description: Campaign Monitor list ID to act on
    type: string
    required: true
    default: ""
  action:
    description: register the webhook, unregister it, or list the webhooks on the list
    type: string
    required: false
    default: register
    enum: [register, unregister, list]
  webhook_url:
    description: The Opt-Out Webhook workflow's webhook URL (filled in automatically by the package installer; for standalone installs, copy it from that workflow's detail page; not needed for list)
    type: string
    required: false
    default: ""
definition:
  name: Register Opt-Out Webhook (Campaign Monitor)
  description: Registers the opt-out webhook URL on a Campaign Monitor list (run manually, once per list).
  icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/link-plus.svg
  version: 1

  on:
    - manual: true

  inputs:
    list_id:
      type: string
      required: true
      default: ""
      label: List ID
      hint: The Campaign Monitor list to act on
    action:
      type: string
      required: false
      default: register
      enum: [register, unregister, list]
      label: Action
      hint: register the webhook, unregister it, or list the webhooks on the list
    webhook_url:
      type: string
      required: false
      default: ""
      label: Webhook URL
      hint: Filled in by the package installer; for standalone installs, copy from the Opt-Out Webhook workflow's detail page (not needed for list)
      # NB: `contains` is an expr operator (a contains b), not a callable function.
      validate: inputs.action == "list" || (hasPrefix(value, "https://") && value contains "/webhook/")

  steps:
    - id: webhook
      includes: libatomic/passport-actions/recipes/cm/webhook-register
      with:
        api_key: ${{ secrets.CM_API_KEY }}
        list_id: ${{ inputs.list_id }}
        action: ${{ inputs.action }}
        url: ${{ inputs.webhook_url }}
        events: ["Deactivate", "Subscribe"]

    - id: report-register
      if: ${{ inputs.action == "register" }}
      action: log
      with:
        message: ${{ ternary(steps.webhook.outputs.register.status == "skipped", "already registered on list " + inputs.list_id + " — nothing to do", "registered on list " + inputs.list_id) }}

    - id: report-unregister
      if: ${{ inputs.action == "unregister" }}
      action: log
      with:
        message: ${{ ternary(steps.webhook.outputs.unregister.status == "skipped", "was not registered on list " + inputs.list_id + " — nothing to do", "unregistered from list " + inputs.list_id) }}

    - id: report-list
      if: ${{ inputs.action == "list" }}
      action: log
      with:
        message: "webhooks on list ${{ inputs.list_id }}: ${{ toJSON(steps.webhook.outputs.existing.body) }}"
