name: Subscription Canceled (Campaign Monitor)
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/account-cancel-outline.svg
description: |
  Marks a subscriber as no longer paid when their subscription ends. List
  membership and subscription state are NOT touched — a cancellation is not an
  unsubscribe. Instead the subscription custom fields are cleared
  (PassportSubscriptionID, PassportPlanID, SubscriptionInterval, AutoRenew,
  SubscriptionCancelsAt) and SubscriptionExpiredAt (a Date field, YYYY/MM/DD)
  is stamped, so CM segments built on those fields update automatically. Uses
  the cm/subscriber-update recipe.

  Fires on user.subscription.deleted — the Stripe path: the
  customer.subscription.deleted webhook deletes the subscription outright
  (Stripe-billed subscriptions never pass through a canceled status, so
  user.subscription.status.canceled does not fire for them). If your instance
  also cancels subscriptions through non-Stripe/admin flows that transition the
  status to canceled, add a second trigger on user.subscription.status.canceled.

  The event sets trigger.user_id, so the user is loaded directly — no
  subscription.get (the row is already gone and the lookup would fail).
  SubscriptionExpiredAt is stamped with the time the deletion event fired
  (not the body's ends_at/cancel_at, which reflect scheduled period dates).

  Requires the CM_API_KEY secret and a list_id input. The SubscriptionExpiredAt
  custom field must exist on the list as a Date field.

  NOTE: the update step is continue-on-error because Campaign Monitor returns a
  400/404 when the email address isn't on the list — a harmless no-op that
  shouldn't fail the run.
category: campaign-monitor
replaces:
  event_type: user.subscription.deleted
  channel: email
inputs:
  list_id:
    description: Campaign Monitor list ID holding the subscription custom fields
    type: string
    required: true
    default: ""
definition:
  name: Subscription Canceled (Campaign Monitor)
  description: Clears subscription custom fields and stamps SubscriptionExpiredAt when a subscription ends.
  icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/account-cancel-outline.svg
  version: 1

  on:
    # Stripe path: the customer.subscription.deleted webhook deletes the
    # subscription without a canceled-status transition — this is the event
    # that actually fires for Stripe-billed instances. Body = the full
    # serialized subscription (the row itself is already gone).
    - event:
        name: user.subscription.deleted
        schema:
          ref: libatomic/passport-actions/schemas/atomic/user.subscription.deleted@v1.0.0

  steps:
    - id: load-user
      action: user.get
      with:
        user_id: ${{ trigger.user_id }}

    - id: update-fields
      includes: libatomic/passport-actions/recipes/cm/subscriber-update
      continue-on-error: true
      with:
        api_key: ${{ secrets.CM_API_KEY }}
        list_id: ${{ inputs.list_id }}
        email: ${{ steps.load-user.outputs.user.profile.email }}
        name: ${{ steps.load-user.outputs.user.profile.name }}
        custom_fields:
          - Key: PassportSubscriptionID
            Clear: true
          - Key: PassportPlanID
            Clear: true
          - Key: SubscriptionInterval
            Clear: true
          - Key: AutoRenew
            Clear: true
          # The scheduled-cancellation date is moot once the subscription is
          # gone — SubscriptionExpiredAt takes over as the terminal date.
          - Key: SubscriptionCancelsAt
            Clear: true
          - Key: SubscriptionExpiredAt
            # CM Date custom fields require YYYY/MM/DD. Stamp the moment the
            # deletion event fired — not the body's ends_at/cancel_at, which
            # reflect the (possibly future or scheduled) period dates.
            Value: ${{ date("2006/01/02", now()) }}
