name: User Deleted (Campaign Monitor)
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/account-remove-outline.svg
description: |
  Deletes a user from a Campaign Monitor list when their Passport account is
  permanently deleted (user.deleted) — so PII doesn't linger in CM after an
  account erasure (e.g. a GDPR right-to-erasure request). Uses the
  cm/subscriber-delete recipe.

  The user row is already gone when this fires: the event body is the full
  serialized user, so the email is read from trigger.body directly (no user.get).

  Install once per CM list the user could be on (all-users, paid, win-back).

  NOTE: the delete step is continue-on-error because Campaign Monitor returns a
  400 ("Subscriber not in list or has already been removed") when the user isn't
  on the list — a harmless no-op that shouldn't fail the run.

  Requires the CM_API_KEY secret and a list_id input.
category: campaign-monitor
inputs:
  list_id:
    label: List to delete the user from
    description: Campaign Monitor list ID to delete the user from
    type: string
    required: true
    default: ""
    # Renders as a dropdown of this account's own lists when the cm
    # plugin is installed, so nobody has to look up a 32-character id.
    # Falls back to a plain text box when it is not — the plugin is a
    # convenience here, not a dependency: this workflow still
    # authenticates with the CM_API_KEY secret either way.
    #
    # No label/value: subscriber_lists_get declares its own
    # result.item, so the picker is two lines.
    data_source:
      plugin: cm
      method: subscriber_lists_get
definition:
  name: User Deleted (Campaign Monitor)
  description: Deletes a user from a Campaign Monitor list when their account is deleted.
  icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/account-remove-outline.svg
  version: 1

  on:
    - event:
        name: user.deleted
        schema:
          ref: libatomic/passport-actions/schemas/atomic/user.deleted@v1.0.0

  steps:
    # The user is already deleted — the event body carries the full user object,
    # so read the email from it rather than calling user.get.
    - id: remove-from-list
      includes: libatomic/passport-actions/recipes/cm/subscriber-delete
      continue-on-error: true
      with:
        api_key: ${{ secrets.CM_API_KEY }}
        list_id: ${{ inputs.list_id }}
        email: ${{ coalesce(trigger.body.profile.email, trigger.body.login) }}
