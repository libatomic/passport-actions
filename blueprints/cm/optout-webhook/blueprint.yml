name: Opt-Out Webhook (Campaign Monitor)
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/webhook.svg
description: |
  Inbound webhook from Campaign Monitor: when a subscriber unsubscribes (or is
  deactivated) in CM, the matching Passport user is opted out of the email channel
  so both systems agree. This is the inbound half of the consent loop — the
  user-email-opt-out blueprint pushes Passport opt-outs to CM; this one pulls CM
  unsubscribes back into Passport.

  Campaign Monitor batches events into a single POST; foreach: Events runs each
  element as its own run, so one bad element doesn't block the rest. Users who
  unsubscribe in CM but don't exist in Passport are skipped (the lookup is
  continue-on-error). user.update replaces the whole preferences object, so the
  workflow round-trips the user's current channel preferences from the lookup
  and sends them back with only email.opt_out changed.

  Workflow runs are silent, so the user.update here does NOT re-fire
  user.preferences.updated workflows — no sync loop back to CM.

  Campaign Monitor does not sign webhook payloads, so validate: false. The token
  in the webhook URL is the sole authorization — treat the URL as a secret, and
  optionally add an ip_allowlist to the trigger for defense in depth.

  Setup: after importing, generate and copy the webhook URL from the workflow
  detail page, then register it on the CM list with the optout-webhook-register
  companion blueprint (or POST /api/v3.3/lists/{listid}/webhooks.json yourself).
category: campaign-monitor
definition:
  name: Opt-Out Webhook (Campaign Monitor)
  description: Opts Passport users out of email when they unsubscribe in Campaign Monitor.
  icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/webhook.svg
  version: 1

  on:
    - webhook: true
      name: campaign-monitor
      validate: false
      foreach: Events
      # "Deactivate" is CM's only inactive-transition event type; it covers
      # unsubscribes, spam complaints, and hard bounces.
      if: body.Type == "Deactivate"

  steps:
    # The unsubscriber may not exist in Passport (e.g. added to the list from
    # another source) — that's fine, skip them. user.get loads the user's full
    # channel preferences; the JSON round-trip normalizes them to plain maps
    # (never-configured channels surface as typed values merge() can't take).
    # A user who has never set any preferences has preferences: nil, so the
    # chain is nil-guarded (?. / ??) down to an empty map.
    - id: lookup
      action: user.get
      continue-on-error: true
      with:
        login: ${{ trigger.body.EmailAddress }}
      outputs:
        channels: '${{ fromJSON(toJSON(steps.lookup.outputs.user.preferences?.channels ?? {})) }}'

    # user.update REPLACES the whole preferences object (no server-side merge),
    # so send the user's current channels back with only email.opt_out changed.
    # merge() is first-wins: the opt_out literal overrides, every other channel
    # and email setting is carried over from the lookup unchanged.
    # Only a real unsubscribe is a consent signal. Deactivate also fires for
    # spam complaints, hard bounces, and subscriber deletion in the CM UI
    # (verified empirically) — none of which should flip the user's Passport
    # email consent, so the step filters on State as well as Type.
    - id: optout
      if: ${{ steps.lookup.status == "ok" && trigger.body.Type == "Deactivate" && trigger.body.State == "Unsubscribed" }}
      action: user.update
      with:
        user_id: ${{ steps.lookup.outputs.user.id }}
        preferences:
          channels: '${{ merge({email: merge({opt_out: true}, outputs.channels.email ?? {})}, outputs.channels) }}'
