name: User Email Opt-Out (Campaign Monitor)
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/email-off-outline.svg
description: |
  Unsubscribes a user from a Campaign Monitor list when they opt out of the email
  channel (user.email.opt_out). Uses the cm/subscriber-unsubscribe recipe.

  NOTE: the unsubscribe step is continue-on-error because Campaign Monitor returns a
  400 ("Subscriber not in list or has already been removed") when the user isn't on
  the list — a harmless no-op that shouldn't fail the run.

  Requires the CM_API_KEY secret and a list_id input.
category: campaign-monitor
replaces:
  event_type: user.email.opt_out
  channel: email
inputs:
  list_id:
    label: List to unsubscribe the user from
    description: Campaign Monitor list ID to unsubscribe the user from
    type: string
    required: true
    default: ""
    # Renders as a dropdown of this account's own lists when the cm
    # plugin is installed, so nobody has to look up a 32-character id.
    # Falls back to a plain text box when it is not — the plugin is a
    # convenience here, not a dependency: this workflow still
    # authenticates with the CM_API_KEY secret either way.
    #
    # No label/value: subscriber_lists_get declares its own
    # result.item, so the picker is two lines.
    data_source:
      plugin: cm
      method: subscriber_lists_get
definition:
  name: User Email Opt-Out (Campaign Monitor)
  description: Unsubscribes a user from a Campaign Monitor list when they opt out of email.
  icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/email-off-outline.svg
  version: 1

  on:
    - event:
        name: user.email.opt_out
        schema:
          ref: libatomic/passport-actions/schemas/atomic/user.email.opt_out@v1.0.0

  steps:
    - id: load-user
      action: user.get
      with:
        user_id: ${{ trigger.user_id }}

    - id: unsubscribe
      includes: libatomic/passport-actions/recipes/cm/subscriber-unsubscribe
      continue-on-error: true
      with:
        api_key: ${{ secrets.CM_API_KEY }}
        list_id: ${{ inputs.list_id }}
        email: ${{ steps.load-user.outputs.user.profile.email }}
