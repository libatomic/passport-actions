name: campaign-monitor
label: Campaign Monitor
icon: https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/email-sync-outline.svg
category: integrations
description: |
  Keeps a Campaign Monitor list in sync with your members on the one-list model:
  verified users are added, subscription custom fields track paid state
  (segments derive paid / auto-renew off / expired / win-back from them),
  per-category newsletter opt-outs sync as opt_out_* flags, and consent flows
  both ways — Passport opt-outs/opt-ins update CM, and CM unsubscribes flow
  back via an inbound webhook. Deleted accounts are erased from the list.
  Installs nine event-triggered workflows built on the cm/* recipes.

  Shared prerequisites: a CM_API_KEY workflow secret and your Campaign Monitor
  list_id (each outbound workflow takes it as an input; optout-webhook needs
  neither); api.createsend.com must be on the instance's http allowlist. The
  custom fields each workflow writes must be created on the CM list first
  (exact keys and types are in the blueprints/cm README — CM silently drops
  undefined fields; Date fields expect YYYY/MM/DD). Workflows install
  disabled — configure the inputs, then enable the ones you want.

blueprints:
  - cm/new-user
  - cm/new-subscriber
  - cm/subscription-updated
  - cm/subscription-canceled
  - cm/preferences-updated
  - cm/user-email-opt-out
  - cm/user-email-opt-in
  - cm/user-deleted
  - cm/optout-webhook

# Custom fields the workflows write. Create each one on the target CM list
# BEFORE enabling (Lists & Subscribers → (list) → Custom Fields) — CM silently
# drops values for fields that don't exist. Keys are the personalization tag
# without brackets; Date fields are sent as YYYY/MM/DD.
custom_fields:
  - key: InstanceName
    type: Text
    set_by: [cm/new-user, cm/new-subscriber]
    description: The Passport instance name
  - key: PassportUserID
    type: Text
    set_by: [cm/new-user, cm/new-subscriber]
    description: The user's Passport ID
  - key: CreatedAt
    type: Date
    set_by: [cm/new-user]
    description: Account creation date
  - key: PassportSubscriptionID
    type: Text
    set_by: [cm/new-subscriber]
    cleared_by: [cm/subscription-canceled]
    description: The subscription's Passport ID
  - key: PassportPlanID
    type: Text
    set_by: [cm/new-subscriber]
    cleared_by: [cm/subscription-canceled]
    description: The plan's Passport ID
  - key: SubscriptionInterval
    type: Text
    set_by: [cm/new-subscriber]
    cleared_by: [cm/subscription-canceled]
    description: Billing interval (month / year)
  - key: AutoRenew
    type: Text
    set_by: [cm/subscription-updated]
    cleared_by: [cm/subscription-canceled]
    description: '"true" / "false"'
  - key: SubscriptionCancelsAt
    type: Date
    set_by: [cm/subscription-updated]
    cleared_by: [cm/subscription-updated]
    description: Scheduled cancellation date; cleared when none is scheduled
  - key: SubscriptionExpiredAt
    type: Date
    set_by: [cm/subscription-canceled]
    description: When the subscription ended
  - key: opt_out_*
    type: Text
    set_by: [cm/preferences-updated]
    description: >
      One field per mapped delivery category (operator-defined keys, e.g.
      opt_out_newsletter1) — "true" when the user opted out of that category
      on email, "false" otherwise. Build reverse segments on these.
